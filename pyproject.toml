[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keystone-bench"
version = "0.4.1"
description = "Paired evidence-perturbation stress tests for clinical chat assistants and their rubric graders (built on HealthBench)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Xin Xu" }]
requires-python = ">=3.10"
keywords = ["benchmark", "evaluation", "llm", "medical", "clinical decision support", "healthbench"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://xinxuxin.github.io/keystone-bench/"
Repository = "https://github.com/xinxuxin/keystone-bench"
Documentation = "https://github.com/xinxuxin/keystone-bench/blob/main/docs/DATA_CARD.md"
Changelog = "https://github.com/xinxuxin/keystone-bench/blob/main/CHANGELOG.md"

[project.optional-dependencies]
inspect = ["inspect-ai>=0.3.100"]
dev = ["pytest>=8", "numpy>=1.26", "scipy>=1.11", "statsmodels>=0.14", "inspect-ai>=0.3.100"]

[project.scripts]
keystone = "keystone.cli:main"

[tool.setuptools]
packages = ["keystone"]

[tool.setuptools.package-data]
keystone = ["healthbench_grader.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
