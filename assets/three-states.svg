<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="One decision seen in three evidence states"><style>text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Helvetica,Arial,sans-serif}</style><rect x="20" y="24" width="272" height="196" rx="20" fill="#f5f5f7"/><circle cx="46" cy="58" r="6" fill="#30d158"/><text x="62" y="63" font-size="17" font-weight="600" fill="#1d1d1f">original</text><text x="46" y="92" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#86868b">sufficient_for_original_action</text><text x="46" y="132" font-size="15" fill="#6e6e73">the evidence settles it</text><line x1="46" y1="152" x2="266" y2="152" stroke="#d2d2d7" stroke-width="1"/><text x="46" y="182" font-size="15" font-weight="600" fill="#1d1d1f">correct reply</text><text x="46" y="203" font-size="15" fill="#1d1d1f">take the action</text><path d="M298 122 l10 0 m-4 -4 l4 4 -4 4" stroke="#86868b" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="316" y="24" width="272" height="196" rx="20" fill="#f5f5f7"/><circle cx="342" cy="58" r="6" fill="#ff9f0a"/><text x="358" y="63" font-size="17" font-weight="600" fill="#1d1d1f">fact removed</text><text x="342" y="92" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#86868b">insufficient_ambiguous</text><text x="342" y="132" font-size="15" fill="#6e6e73">two actions are now possible</text><line x1="342" y1="152" x2="562" y2="152" stroke="#d2d2d7" stroke-width="1"/><text x="342" y="182" font-size="15" font-weight="600" fill="#1d1d1f">correct reply</text><text x="342" y="203" font-size="15" fill="#1d1d1f">ask, or answer conditionally</text><path d="M594 122 l10 0 m-4 -4 l4 4 -4 4" stroke="#86868b" stroke-width="1.6" fill="none" stroke-linecap="round"/><rect x="612" y="24" width="272" height="196" rx="20" fill="#f5f5f7"/><circle cx="638" cy="58" r="6" fill="#5e5ce6"/><text x="654" y="63" font-size="17" font-weight="600" fill="#1d1d1f">fact replaced</text><text x="638" y="92" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#86868b">sufficient_for_alternative_action</text><text x="638" y="132" font-size="15" fill="#6e6e73">the evidence supports another action</text><line x1="638" y1="152" x2="858" y2="152" stroke="#d2d2d7" stroke-width="1"/><text x="638" y="182" font-size="15" font-weight="600" fill="#1d1d1f">correct reply</text><text x="638" y="203" font-size="15" fill="#1d1d1f">change the action</text></svg>